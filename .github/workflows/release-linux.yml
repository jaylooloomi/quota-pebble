name: Linux native package verification
on:
  push:
    branches: ['codex/**']
    paths: [.github/workflows/release-linux.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm audit --omit=dev
      - name: Build native x64 AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never --config.linux.executableName=quota-pebble
      - name: Verify packaged UI under Xvfb
        run: |
          export QUOTA_PACKAGED_EXE="$PWD/release/linux-unpacked/quota-pebble"
          file "$QUOTA_PACKAGED_EXE"
          xvfb-run -a --server-args="-screen 0 1440x1080x24" node scripts/platform-package-smoke.cjs
          xvfb-run -a --server-args="-screen 0 1440x1080x24" node scripts/companion-features-test.cjs
      - name: Checksums
        run: cd release && sha256sum *.AppImage > SHA256SUMS-Linux-x64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-x64
          path: |
            release/*.AppImage
            release/SHA256SUMS-Linux-x64.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-evidence
          path: test-results/**
