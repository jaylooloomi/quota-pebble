<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1d242d"/><stop offset="1" stop-color="#0d1116"/></linearGradient></defs><rect width="960" height="790" rx="24" fill="url(#bg)"/><g font-family="Segoe UI,Microsoft JhengHei,sans-serif"><rect x="40" y="40" width="6" height="44" rx="3" fill="#9ce1cc"/><text x="64" y="76" font-size="29" fill="#eef3fa" font-weight="700" text-anchor="start">03 合併通知匣（推薦）</text><text x="64" y="115" font-size="17" fill="#b8c5d5" font-weight="400" text-anchor="start">短時間同時到達的提醒，整合成一張清楚的摘要</text><rect x="248" y="172" width="464" height="209" rx="16" fill="#1a2530" stroke="#7a96b2"/><text x="268" y="204" font-size="18" fill="#e2edf9" font-weight="650" text-anchor="start">任務更新 · 3 則</text><text x="690" y="203" font-size="22" fill="#94a5b9" font-weight="400" text-anchor="end">×</text><path d="M268 217H691" stroke="#3a4c5e"/><text x="268" y="243" font-size="13" fill="#9ee7b8" font-weight="650" text-anchor="start">✓ Claude Code</text><text x="415" y="243" font-size="13" fill="#e7eef7" font-weight="400" text-anchor="start">測試報告已完成</text><text x="690" y="243" font-size="11" fill="#a9bfd8" font-weight="400" text-anchor="end">查看 ›</text><text x="268" y="281" font-size="13" fill="#9ee7b8" font-weight="650" text-anchor="start">✓ Codex</text><text x="415" y="281" font-size="13" fill="#e7eef7" font-weight="400" text-anchor="start">作品集網站已完成</text><text x="690" y="281" font-size="11" fill="#a9bfd8" font-weight="400" text-anchor="end">查看 ›</text><text x="268" y="319" font-size="13" fill="#a6d1fa" font-weight="650" text-anchor="start">Ⅱ Antigravity</text><text x="415" y="319" font-size="13" fill="#e7eef7" font-weight="400" text-anchor="start">資料分析已閒置</text><text x="690" y="319" font-size="11" fill="#a9bfd8" font-weight="400" text-anchor="end">查看 ›</text><text x="268" y="358" font-size="11" fill="#99afc7" font-weight="400" text-anchor="start">▣ 工作電腦　·　2 則完成 / 1 則閒置</text><path d="M471 381l9 12 9-12" fill="#1a2530" stroke="#7a96b2"/><rect x="206" y="420" width="548" height="72" rx="36" fill="#0d1216" stroke="#4c5664"/><text x="225" y="450" font-size="13" fill="#e3eaf3" font-weight="650" text-anchor="start">Quota Pebble</text><text x="225" y="468" font-size="9" fill="#8192a8" font-weight="400" text-anchor="start">v1.26.2</text><path d="M336 435v42M454 435v42M573 435v42" stroke="#333f4d"/><text x="353" y="464" font-size="22" fill="#ffb18d" font-weight="650" text-anchor="start">✳ 85%</text><text x="474" y="464" font-size="22" fill="#edf2f8" font-weight="650" text-anchor="start">◉ 69%</text><text x="590" y="464" font-size="22" fill="#bca7ff" font-weight="650" text-anchor="start">✦ 25%</text><text x="704" y="463" font-size="22" fill="#b7c4d3" font-weight="400" text-anchor="start">⌄</text><text x="64" y="550" font-size="16" fill="#d7e3ef" font-weight="400" text-anchor="start">收集 2 秒內的通知；單則保留原卡，多則顯示最多三筆。</text><text x="64" y="585" font-size="16" fill="#b8c5d5" font-weight="400" text-anchor="start">摘要顯示 20 秒，滑鼠移入暫停；每筆可直接查看對應任務。</text><text x="64" y="620" font-size="15" fill="#a3c8dd" font-weight="400" text-anchor="start">優點：同時看見三家、較少遮擋。代價：不分別對準三個圖示。</text><text x="64" y="689" font-size="14" fill="#b8c5d5" font-weight="400" text-anchor="start">共通：完成用綠色、閒置用藍色；同任務重複事件合併，完成優先於閒置。</text><text x="64" y="722" font-size="14" fill="#b8c5d5" font-weight="400" text-anchor="start">通知靠近標題避讓；等待中的事件保留，過多時顯示未讀數，不默默丟棄。</text><text x="903" y="765" font-size="12" fill="#7f8fa5" font-weight="400" text-anchor="end">方案示意 · 尚未套用</text></g></svg>